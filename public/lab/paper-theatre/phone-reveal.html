<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You found the real Maya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Ultra&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .stub { justify-content: flex-start; gap: 14px; padding: 12px 14px 12px 12px; }
  .seal { position: relative; flex: none; filter: drop-shadow(0 2px 0 #4a0b10) drop-shadow(0 5px 5px rgba(0,0,0,.4)); transform: rotate(-8deg); }
  .seal .roundel { width: 84px; height: 84px; --tint: var(--gold); }
  .seal .roundel b { font: 400 25px/1 var(--f-display); color: var(--red-deep); letter-spacing: -.01em; }
  .result h1 { margin: 0; font: italic 25px/1.08 var(--f-story); color: #fff3d6; }
  .result .score { display: inline-block; margin-top: 7px; padding: 4px 10px 5px; font: 700 16px/1 var(--f-ui); color: var(--ink); background: #f3e6c8; border-radius: 2px; transform: rotate(-1deg); box-shadow: 0 2px 0 #4a0b10; }
  .result .score b { font-weight: 800; color: var(--red); }

  .stage-panel { padding-top: 88px; }
  .flapcard { --w: 100%; --h: 130px; }
  .flapcard .face { padding: 18px 18px 12px 30px; }
  .flapcard .answer-text { font-size: 18px; line-height: 1.3; }
  .flapcard .flap { z-index: 3; } .flapcard .inside { z-index: 2; }
  .flapcard.lifted { perspective: 900px; margin-top: 94px; }
  .flapcard.lifted .flap { z-index: 0; --lift: 116deg; }
  .flapcard .inside .slip { position: absolute; inset: 10px 10px 10px 12px; padding: 9px 14px 8px 16px; display: flex; flex-direction: column; isolation: isolate; transform: rotate(-.6deg); }
  .flapcard .inside .slip::before { content: ""; position: absolute; inset: 0; z-index: -1; background: url(art/grain.svg), linear-gradient(#f6ead0, #ead8b0); filter: url(#rough) drop-shadow(0 1px 0 #a88d5a) drop-shadow(0 3px 3px rgba(0,0,0,.45)); }
  .flapcard .inside .slip .answer-text { font-size: 18px; }
  .ai { position: absolute; right: 10px; bottom: 9px; padding: 4px 9px 5px; font: 700 14px/1 var(--f-ui); color: var(--cream); background: var(--teal); border-radius: 2px; letter-spacing: .01em; }
  .wolf { position: absolute; z-index: 1; right: 4px; top: -112px; height: 300px; transform: rotate(4deg); filter: drop-shadow(0 2px 0 #a88d5a) drop-shadow(4px 6px 6px rgba(0,0,0,.55)); }
  .owl { position: absolute; z-index: 1; right: 22px; top: -44px; transform: rotate(8deg); filter: drop-shadow(0 1px 0 #a88d5a) drop-shadow(2px 4px 4px rgba(0,0,0,.5)); }
  .owl .roundel { width: 62px; height: 62px; --tint: #2f6670; } .owl .roundel .emo { font-size: 32px; }
  .ribbon { position: absolute; z-index: 8; left: 26px; bottom: -19px; height: 40px; padding: 0 30px; display: grid; place-items: center; white-space: nowrap;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)) drop-shadow(0 5px 5px rgba(0,0,0,.4)); transform: rotate(-2deg); }
  .ribbon::before { content: ""; position: absolute; inset: 0; z-index: -1; clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 50%, 100% 100%, 0 100%, 14px 50%); }
  .ribbon.real { font: italic 22px/1 var(--f-story); color: #fff3d6; }
  .ribbon.real::before { background: url(art/grain.svg), linear-gradient(#b42a2f, #8a1b20); }
  .ribbon.wolfish { left: auto; right: 74px; font: 400 17px/1 var(--f-display); color: var(--gold); transform: rotate(2deg); }
  .ribbon.wolfish::before { background: url(art/grain.svg), linear-gradient(#2a221c, #16110e); }

  .tell { margin-top: auto; padding-top: 28px; }
  .tell .label { color: #f3e6c8; font-size: 22px; }
  .tell .field { border-color: #0b2227; }
  .tell .ticket-wrap { margin-top: 12px; }
  .tell .ticket { min-height: 56px; font-size: 21px; }
</style>
</head>
<body class="phone">
<svg class="sr-defs" aria-hidden="true">
  <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="8"/>
    <feDisplacementMap in="SourceGraphic" scale="5"/>
  </filter>
</svg>

<main class="ticket-card paper">
  <div class="border" aria-hidden="true"></div>
  <header class="stub">
    <div class="seal" aria-label="plus 100 points"><span class="roundel"><b>+100</b></span></div>
    <div class="result">
      <h1>You found<br>the real Maya.</h1>
      <span class="score">Your score: <b>300</b></span>
    </div>
  </header>
  <div class="perf" aria-hidden="true"><span class="notch l"></span><span class="notch r"></span></div>

  <section class="stage-panel">
    <img class="valance" src="art/valance.svg" alt="" aria-hidden="true">
    <img class="bank" src="art/flat-near.svg" alt="" aria-hidden="true">

    <article class="flapcard" data-slot="A" aria-label="Answer A, the real Maya">
      <div class="owl" aria-hidden="true"><span class="roundel"><span class="emo">🦉</span></span></div>
      <span class="slot-tab">A</span>
      <div class="inside"></div>
      <div class="flap">
        <div class="face front">
          <span class="pin hinge h1"></span><span class="pin hinge h2"></span>
          <p class="answer-text">i will reorganize your spice rack while you shower and call it love</p>
        </div>
      </div>
      <span class="ribbon real">The real Maya</span>
    </article>

    <article class="flapcard lifted" data-slot="B" aria-label="Answer B, written by the Wolf">
      <img class="wolf" src="art/wolf.png" alt="The Wolf puppet in a lace bonnet">
      <span class="slot-tab">B</span>
      <div class="flap">
        <div class="face front"></div>
        <div class="face back"><span class="pin hinge h1"></span><span class="pin hinge h2"></span></div>
      </div>
      <div class="inside">
        <div class="slip">
          <p class="answer-text">overthinking a text for 40 minutes then just sending 'k' 💀</p>
          <span class="ai">AI-written</span>
        </div>
      </div>
      <span class="ribbon wolfish">It was the Wolf!</span>
    </article>

    <form class="tell" onsubmit="return false">
      <label class="label" for="tell">What gave the Wolf away?</label>
      <input class="field" id="tell" name="tell" placeholder="The 💀 was too much" maxlength="120">
      <div class="ticket-wrap"><button class="ticket" type="submit">Tell the village</button></div>
    </form>
  </section>
</main>
</body>
</html>
