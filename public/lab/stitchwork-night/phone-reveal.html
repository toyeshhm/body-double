<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Double · Reveal (Stitchwork: Night Quilt)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&family=Figtree:wght@500..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { --moon-x: 96%; --moon-y: 0%; }
  h1 { font-size: 33px; margin-top: 22px; }

  .score { display: flex; align-items: center; gap: 16px; margin-top: 14px; }
  .plus { flex: none; width: 168px; height: 84px; display: grid; place-items: center; border-radius: 6px; box-shadow: var(--lift); --sti: url(art/run-cream.svg); --si: 5px; --sw: 9px; }
  .plus svg { width: 150px; height: 66px; overflow: visible; }
  .total { line-height: 1; }
  .total small { display: block; font-size: 15px; font-weight: 700; color: var(--gold-hi); margin-bottom: 4px; }
  .total b { font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 800; font-size: 46px; color: var(--cream); }

  .cards { position: relative; margin-top: 22px; }
  .label { padding: 30px 20px 22px 66px; display: block; }
  .label .tab { left: 14px; width: 40px; height: 52px; font-size: 24px; }
  .label .answer { display: block; font-size: 17px; line-height: 1.4; margin-top: 6px; }
  .ribbon { display: inline-flex; align-items: center; height: 30px; padding: 0 14px; font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 800; font-size: 16px; white-space: nowrap;
    clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 50%, 100% 100%, 0 100%); padding-right: 22px; }
  .ribbon.real { color: var(--ink); background-color: var(--gold); }
  .ribbon.wolf { color: var(--cream); background-color: var(--wine); }

  .real-card { transform: rotate(-.6deg); }
  .mini-rosette { position: absolute; right: -10px; top: -26px; width: 64px; z-index: 7; transform: rotate(10deg); }

  /* B: unpicked, slid down, the Wolf patch exposed behind it */
  .wolf-wrap { position: relative; margin-top: 18px; }
  .wolf-wrap .footprint { position: absolute; left: 0; right: 0; top: 0; height: 64px; border-radius: 3px; background: rgba(5,7,20,.42); }
  .wolf-wrap .footprint::after { content: ""; position: absolute; inset: 1px; border: 10px solid transparent; border-image: url(art/holes.svg) 16 round; }
  .wolf-mini { position: absolute; right: 8px; top: -26px; width: 108px; z-index: 1; }
  .wolf-mini::before { content: ""; position: absolute; left: -40px; top: -30px; width: 190px; height: 170px; border-radius: 50%; background: radial-gradient(ellipse, rgba(236,226,196,.28), transparent 65%); }
  .wolf-mini img { position: relative; width: 108px; display: block; filter: drop-shadow(0 8px 8px rgba(2,3,10,.6)); }
  .wolf-mini .glint { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; animation: glint 2.4s ease-in-out infinite; }
  .wolf-card { position: relative; z-index: 3; transform: translate(-4px, 50px) rotate(2.4deg); transform-origin: 0 0; }
  .care { position: absolute; right: 14px; bottom: -16px; height: 32px; padding: 0 12px; display: flex; align-items: center; z-index: 5;
    font-size: 13px; font-weight: 750; color: var(--ink); letter-spacing: .02em; transform: rotate(-3deg); box-shadow: 0 5px 8px rgba(2,3,10,.4);
    --sti: url(art/run-indigo.svg); --si: 3px; --sw: 7px; }
  .thread { position: absolute; left: 10px; top: 60px; z-index: 2; }

  .tell { margin-top: 82px; }
  .tell .eyes { font-family: var(--display); font-variation-settings: "SOFT" 100; font-style: italic; font-weight: 600; font-size: 21px; color: var(--gold-hi); margin: 0 0 8px 2px; }
  .input { height: 56px; display: flex; align-items: center; padding: 0 20px; border-radius: 3px; font-size: 18px; font-weight: 600; color: #5d6280;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 rgba(0,0,0,.35), 0 10px 18px rgba(2,3,10,.45); --sti: url(art/run-indigo.svg); --si: 5px; --sw: 10px; }
  .phone .btn { margin-top: 16px; }
</style>
</head>
<body class="phone">
<svg class="defs" aria-hidden="true">
  <defs>
    <pattern id="satin" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <rect width="4" height="4" fill="#b07e22"/><rect y=".2" width="4" height="2.5" fill="#e5bb58"/><rect y=".8" width="4" height=".9" fill="#fbe6a2"/><rect y="3.4" width="4" height=".6" fill="#6e4a10"/>
    </pattern>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#02030a" flood-opacity=".6"/></filter>
  </defs>
</svg>
<img class="full quilt" src="art/quilt-phone-reveal.svg" width="390" height="844" alt="">
<div class="inner">
  <header class="top">
    <span class="brandmark"><img src="art/star.svg" alt="">Body Double</span>
    <span class="code-tab velvet st">Village <b>HXQR</b></span>
  </header>

  <h1 class="p-h">You found the<br><em>real Maya</em>.</h1>

  <div class="score">
    <div class="plus velvet st">
      <svg viewBox="0 0 150 66" role="img" aria-label="plus 100">
        <g filter="url(#lift)"><text class="satin-text" x="75" y="54" text-anchor="middle" font-size="58" letter-spacing="1" fill="#3a2604" stroke="#3a2604" stroke-width="4" stroke-linejoin="round">+100</text></g>
        <text class="satin-text" x="75" y="54" text-anchor="middle" font-size="58" letter-spacing="1" fill="url(#satin)">+100</text>
      </svg>
    </div>
    <div class="total"><small>Your score:</small><b>300</b></div>
  </div>

  <div class="cards">
    <div class="label muslin st real-card">
      <span class="tab felt indigo">A</span>
      <span class="ribbon real felt">The real Maya</span>
      <span class="answer">i will reorganize your spice rack while you shower and call it love</span>
      <img class="mini-rosette" src="art/rosette.svg" alt="">
    </div>

    <div class="wolf-wrap">
      <div class="footprint"></div>
      <div class="wolf-mini">
        <img src="art/wolf-night.png" alt="The Wolf patch">
        <span class="glint" style="left:33%;top:42%"><svg viewBox="0 0 46 46"><path d="M23 4 L25.5 20.5 L42 23 L25.5 25.5 L23 42 L20.5 25.5 L4 23 L20.5 20.5Z" fill="#fff7d6"/></svg></span>
        <span class="glint" style="left:66%;top:41%;animation-delay:-1.1s"><svg viewBox="0 0 46 46"><path d="M23 4 L25.5 20.5 L42 23 L25.5 25.5 L23 42 L20.5 25.5 L4 23 L20.5 20.5Z" fill="#fff7d6"/></svg></span>
      </div>
      <div class="label muslin st wolf-card">
        <span class="tab felt indigo">B</span>
        <span class="ribbon wolf felt">It was the Wolf!</span>
        <span class="answer">overthinking a text for 40 minutes then just sending 'k' 💀</span>
        <span class="care muslin st">AI-written</span>
      </div>
    </div>
  </div>

  <div class="tell">
    <p class="eyes">What big eyes you have...</p>
    <div class="input muslin st">What gave the Wolf away?</div>
    <button class="btn st">
      <svg class="ico" viewBox="0 0 30 30" aria-hidden="true"><path d="M5 7 H25 V20 H14 L8 25 V20 H5Z" fill="none" stroke="#131931" stroke-width="2.6" stroke-linejoin="round"/></svg>
      Tell the village
    </button>
  </div>
</div>
<img class="full binding" src="art/binding-phone.svg" width="390" height="844" alt="">
</body>
</html>
