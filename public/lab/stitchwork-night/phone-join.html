<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Double · Enter the village (Stitchwork: Night Quilt)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&family=Figtree:wght@500..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { --moon-x: 90%; --moon-y: 0%; }
  h1 { font-size: 38px; margin: 30px 0 0 2px; }
  .sec { margin-top: 28px; }
  .phone .inner { padding-left: 22px; padding-right: 22px; }

  .field { height: 58px; display: flex; align-items: center; padding: 0 22px; border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 rgba(0,0,0,.35), 0 10px 18px rgba(2,3,10,.45);
    font-size: 22px; font-weight: 700; color: var(--ink); --sti: url(art/run-indigo.svg); --si: 5px; --sw: 10px; }
  .caret { display: inline-block; width: 2.5px; height: 26px; margin-left: 2px; background: var(--wine); animation: breathe 1s steps(2) infinite; }

  /* avatar patches: English paper-pieced hexies, Grandmother's Garden style */
  .hexes { filter: drop-shadow(0 2px 0 rgba(0,0,0,.45)) drop-shadow(0 6px 8px rgba(2,3,10,.4)); }
  .hexes .row { display: flex; justify-content: center; gap: 2px; }
  .hexes .row + .row { margin-top: -13px; }
  .hex { position: relative; width: 56px; height: 65px; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); font-size: 27px; line-height: 1;
    background-blend-mode: normal, overlay; background-size: auto, 420px; }
  .hex::after { content: ""; position: absolute; inset: 0; background: url(art/hex-cream.svg) 0 0 / 100% 100% no-repeat; opacity: .8; }
  .hex span { position: relative; z-index: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .f1 { background-image: radial-gradient(circle, rgba(239,230,207,.5) 1.1px, transparent 1.6px), url(art/felt.png); background-size: 9px 9px, 420px; background-color: #27306a; }
  .f2 { background-image: repeating-linear-gradient(90deg, rgba(239,230,207,.16) 0 2px, transparent 2px 7px), url(art/felt.png); background-color: #3a4372; }
  .f3 { background-image: radial-gradient(circle, rgba(214,164,67,.65) 1.2px, transparent 1.7px), url(art/felt.png); background-size: 10px 10px, 420px; background-color: #23232c; }
  .f4 { background-image: repeating-linear-gradient(45deg, rgba(140,160,240,.16) 0 2px, transparent 2px 8px), url(art/felt.png); background-color: #161c40; }
  .f5 { background-image: radial-gradient(circle, rgba(239,230,207,.42) 1.1px, transparent 1.6px), url(art/felt.png); background-size: 8px 8px, 420px; background-color: #5e1828; }
  .f6 { background-image: repeating-linear-gradient(0deg, rgba(239,230,207,.13) 0 2px, transparent 2px 8px), url(art/felt.png); background-color: #1d3a48; }
  .hex.on { background-image: url(art/felt.png); background-size: 420px; background-blend-mode: overlay; background-color: var(--lantern); transform: translateY(-4px) scale(1.06); z-index: 2; }
  .hex.on::after { background-image: url(art/hex-indigo.svg); opacity: 1; }
  .hexes .glow { position: absolute; }

  .roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .chip { height: 52px; border: 0; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
    font-family: var(--sans); font-size: 15.5px; font-weight: 700; color: var(--cream);
    background-color: #2c3566; background-image: url(art/felt.png); background-size: 420px; background-blend-mode: overlay;
    box-shadow: 0 2px 0 rgba(0,0,0,.4), 0 8px 12px rgba(2,3,10,.35); --sti: url(art/run-cream.svg); --si: 2px; --sw: 8px; }
  .chip.on { background-color: var(--lantern); color: var(--ink); font-weight: 800; box-shadow: 0 2px 0 #8f5a0a, 0 8px 14px rgba(2,3,10,.4), 0 0 26px rgba(242,182,50,.35); --sti: url(art/run-indigo.svg); }
  .chip.on svg { width: 14px; height: 14px; }
  .go { margin-top: auto; }
  .fineprint { margin-top: 14px; }
</style>
</head>
<body class="phone">
<img class="full quilt" src="art/quilt-phone-join.svg" width="390" height="844" alt="">
<div class="inner">
  <header class="top">
    <span class="brandmark"><img src="art/star.svg" alt="">Body Double</span>
    <span class="code-tab velvet st">Village <b>HXQR</b></span>
  </header>

  <h1 class="p-h">Enter the <em>village</em></h1>

  <div class="sec">
    <p class="p-label">Your name</p>
    <div class="field muslin st">Maya<span class="caret"></span></div>
  </div>

  <div class="sec">
    <p class="p-label">Pick your patch</p>
    <div class="hexes">
      <div class="row">
        <button class="hex f1" aria-label="fox"><span>🦊</span></button>
        <button class="hex on" aria-label="owl, selected" aria-pressed="true"><span>🦉</span></button>
        <button class="hex f3" aria-label="frog"><span>🐸</span></button>
        <button class="hex f5" aria-label="bear"><span>🐻</span></button>
        <button class="hex f2" aria-label="hedgehog"><span>🦔</span></button>
      </div>
      <div class="row">
        <button class="hex f4" aria-label="rabbit"><span>🐰</span></button>
        <button class="hex f6" aria-label="deer"><span>🦌</span></button>
        <button class="hex f2" aria-label="squirrel"><span>🐿️</span></button>
        <button class="hex f1" aria-label="mushroom"><span>🍄</span></button>
        <button class="hex f3" aria-label="sunflower"><span>🌻</span></button>
        <button class="hex f5" aria-label="apple"><span>🍎</span></button>
      </div>
      <div class="row">
        <button class="hex f6" aria-label="strawberry"><span>🍓</span></button>
        <button class="hex f4" aria-label="cupcake"><span>🧁</span></button>
        <button class="hex f2" aria-label="teapot"><span>🫖</span></button>
        <button class="hex f1" aria-label="candle"><span>🕯️</span></button>
        <button class="hex f3" aria-label="moon"><span>🌙</span></button>
      </div>
    </div>
  </div>

  <div class="sec">
    <p class="p-label">Your role</p>
    <div class="roles">
      <button class="chip st">woodcutter</button>
      <button class="chip st">baker</button>
      <button class="chip on st" aria-pressed="true"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 0 L8.4 5.6 L14 7 L8.4 8.4 L7 14 L5.6 8.4 L0 7 L5.6 5.6Z" fill="#131931"/></svg>bard</button>
      <button class="chip st">knight</button>
      <button class="chip st">witch</button>
      <button class="chip st">fairy</button>
    </div>
  </div>

  <button class="btn go st">
    <svg class="ico" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3 V7" stroke="#131931" stroke-width="2.4" stroke-linecap="round"/><path d="M10 8 H20 L21.5 11 H8.5Z" fill="#131931"/><path d="M15 11 C 24 11, 24 25, 15 25 C 6 25, 6 11, 15 11Z" fill="none" stroke="#131931" stroke-width="2.6"/><path d="M11 26 H19" stroke="#131931" stroke-width="2.6" stroke-linecap="round"/></svg>
    Enter the village
  </button>
  <p class="fineprint">18+ only. Everything is deleted when the game ends.</p>
</div>
<img class="full binding" src="art/binding-phone.svg" width="390" height="844" alt="">
</body>
</html>
