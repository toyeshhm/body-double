<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Enter the village · Body Double</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..800,0..100,0..1;1,9..144,400..800,0..100,0..1&family=Nanum+Pen+Script&family=Alegreya+Sans:wght@400;500;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .fern { position: absolute; right: 10px; top: -60px; height: 190px; transform: rotate(62deg); opacity: .9; z-index: 4; }
  h1 { position: absolute; left: 22px; top: 92px; font-size: 44px; line-height: 1; font-style: italic; z-index: 2; }
  .title-wash { position: absolute; left: -6px; top: 82px; width: 380px; height: 74px; background: url(art/wash-sienna.png) 0 0 / 100% 150% no-repeat; opacity: .3; z-index: 1; }
  .field-tape { left: -14px; top: 22px; width: 60px; height: 24px; transform: rotate(-38deg); }
  .sub { position: absolute; left: 26px; top: 142px; font-size: 26px; color: var(--sienna-ink); z-index: 2; }

  .lbl { font-family: var(--f-hand); font-size: 26px; line-height: 1; color: var(--ink-2); margin-bottom: 6px; }
  .name { position: absolute; left: 22px; right: 30px; top: 190px; z-index: 2; }
  .field { height: 54px; display: flex; align-items: center; padding: 0 16px; background: var(--sheet);
           font-size: 25px; font-weight: 700; color: var(--ink);
           box-shadow: inset 0 -2.5px 0 var(--ink), 0 1px 1px rgba(60,40,20,.2), 0 4px 8px rgba(40,26,12,.12); }
  .field .caret { width: 2px; height: 28px; background: var(--madder); margin-left: 2px; }

  .creature { position: absolute; left: 22px; right: 30px; top: 284px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 6px; }
  .cell { height: 52px; display: grid; place-items: center; position: relative; border: 0; background: none; font-size: 28px; }
  .cell::before { content: ""; position: absolute; width: 50px; height: 50px; border-radius: 50% 46% 52% 48% / 48% 52% 46% 50%; background: rgba(214, 196, 160, .22);
                  border: 1.5px solid rgba(90,72,61,.32); z-index: -1; }
  .cell { isolation: isolate; }
  .cell.on::before { background: url(art/wash-indigo.png) 30% 40% / 900% auto; box-shadow: none; opacity: .9; }
  .cell.on::after { content: ""; position: absolute; width: 60px; height: 58px; border: 2.5px solid var(--ink); border-radius: 52% 46% 55% 45% / 47% 55% 44% 53%; transform: rotate(-8deg); }

  .roles { position: absolute; left: 22px; right: 30px; top: 556px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px 8px; }
  .chip { height: 48px; border: 0; display: flex; align-items: center; justify-content: center; position: relative; flex: 1 1 auto; padding-right: 14px;
          font-family: var(--f-ui); font-size: 19px; font-weight: 700; color: var(--ink); background: #f3ead6;
          clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%);
          padding-left: 30px; }
  .chip::before { content: ""; position: absolute; left: 15px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 1.5px rgba(90,72,61,.5); }
  .chip.on { background: var(--sap-ink); color: #fbf7ec; }
  .chip.on::before { background: var(--paper); box-shadow: none; }

  .go { left: 22px; width: 336px; top: 712px; height: 60px; font-size: 24px; }
  .fine { position: absolute; left: 22px; right: 30px; top: 788px; text-align: center; font-size: 16px; line-height: 1.35; color: var(--ink-2); }
  .fine b { font-weight: 800; color: var(--ink); }
</style>
</head>
<body class="phone desk">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="deckle" x="-3%" y="-3%" width="106%" height="106%">
    <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="3" seed="5" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<main class="leaf paper">
  <img class="fern" src="art/fern-small.svg" alt="">
  <header class="p-head">
    <div class="brand display">Body <em>Double</em></div>
    <div class="codechip"><div class="tape green"></div><span class="hand">village</span><b>HXQR</b></div>
  </header>

  <div class="title-wash"></div>
  <h1 class="display">Enter the village</h1>
  <p class="sub hand">Gran keeps a page for every guest</p>

  <div class="name">
    <div class="lbl">your name</div>
    <div class="field" style="position:relative"><div class="tape sienna field-tape"></div>Maya<span class="caret"></span></div>
  </div>

  <div class="creature">
    <div class="lbl">pick your creature</div>
    <div class="grid">
      <button class="cell">🦊</button><button class="cell on" aria-pressed="true">🦉</button><button class="cell">🐸</button><button class="cell">🐻</button>
      <button class="cell">🦔</button><button class="cell">🐰</button><button class="cell">🦌</button><button class="cell">🐿️</button>
      <button class="cell">🍄</button><button class="cell">🌻</button><button class="cell">🍎</button><button class="cell">🍓</button>
      <button class="cell">🧁</button><button class="cell">🫖</button><button class="cell">🕯️</button><button class="cell">🌙</button>
    </div>
  </div>

  <div class="roles">
    <div class="lbl">and your role in the tale</div>
    <div class="chips">
      <button class="chip">woodcutter</button><button class="chip">baker</button><button class="chip on" aria-pressed="true">bard</button>
      <button class="chip">knight</button><button class="chip">witch</button><button class="chip">fairy</button>
    </div>
  </div>

  <button class="btn-paint go">Enter the village <span class="arrow">→</span></button>
  <p class="fine"><b>18+ only.</b> Everything is deleted when the game ends.</p>
</main>
</body>
</html>
