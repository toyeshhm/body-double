<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Body Double · Vote (Stitchwork)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@600;700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 26px; }
  .head h1 { font-size: 29px; line-height: 1.08; color: var(--tomato-deep); filter: url(#felt) drop-shadow(0 2px 0 rgba(60,40,20,.25)); }
  .head h1 span { color: var(--charcoal); }
  .timer { position: relative; width: 84px; height: 84px; flex: none; }
  .timer svg { width: 84px; height: 84px; display: block; overflow: visible; }
  .timer .n { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .timer .n b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: .9; color: var(--charcoal); }
  .timer .n small { font-weight: 900; font-size: 12px; color: var(--ink-soft); }

  .phone .label { position: relative; width: 100%; min-height: 176px; padding: 58px 26px 26px 28px; margin-bottom: 24px; display: block;
    --st-inset: 7px; --st-w: 8px; border: 0; text-align: left; font: inherit; cursor: pointer;
    box-shadow: 0 2px 0 rgba(60,40,20,.15), 0 8px 14px rgba(60,40,20,.22); }
  .phone .label .slot { left: 16px; top: -5px; width: 44px; height: 52px; font-size: 25px; }
  .phone .label .answer { font-size: 21px; line-height: 1.38; }
  .phone .label.picked { box-shadow: 0 0 0 6px var(--tomato), 0 0 0 7.5px #7d1d10, 0 12px 18px rgba(60,40,20,.35); }
  .slot-a { transform: rotate(-.8deg); }
  .slot-b { transform: rotate(.8deg); }
  .pick-tag { position: absolute; right: -6px; top: -26px; z-index: 3; display: flex; align-items: center; transform: rotate(5deg); }
  .pick-tag svg { width: 46px; height: 22px; margin-right: -8px; position: relative; z-index: 2; }
  .pick-tag span { height: 34px; padding: 0 14px 0 18px; display: flex; align-items: center; font-weight: 900; font-size: 16px; color: var(--charcoal);
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%); box-shadow: 0 3px 4px rgba(0,0,0,.25); }
  .helper { font-size: 16px; font-weight: 700; color: var(--ink-soft); text-align: center; line-height: 1.4; margin-top: 2px; text-wrap: balance; }
  .helper b { color: var(--charcoal); }

  .meadow { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; pointer-events: none; }
  .meadow img { position: absolute; bottom: -14px; filter: drop-shadow(0 4px 4px rgba(60,40,20,.3)); }
</style>
</head>
<body class="phone">
<svg class="defs" aria-hidden="true">
  <filter id="felt" x="-5%" y="-10%" width="110%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="3" result="warp"/>
    <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="patch"><div class="inner">
  <div class="top">
    <div class="woven">Body Double</div>
    <div class="code-chip felt-forest"><span class="mini-hoop"></span>Village <b>HXQR</b></div>
  </div>

  <div class="head">
    <h1 class="felt-type">Which one is <span>really Maya?</span></h1>
    <div class="timer" role="timer" aria-label="14 seconds left">
      <svg viewBox="0 0 84 84" aria-hidden="true">
        <circle cx="42" cy="42" r="39" fill="none" stroke="#c88a48" stroke-width="6"/>
        <circle cx="42" cy="42" r="39" fill="none" stroke="#7a4a20" stroke-opacity=".35" stroke-width="1" stroke-dasharray="20 6 34 9"/>
        <circle cx="42" cy="42" r="35.5" fill="#f5ecd8" stroke="#8a5a2b" stroke-width="1.5"/>
        <path d="M14.42 50.96 A29 29 0 0 1 42 13" fill="none" stroke="#a8977a" stroke-width="2.4" stroke-dasharray=".1 5" stroke-linecap="round"/>
        <path d="M42 13 A29 29 0 1 1 14.42 50.96" fill="none" stroke="#d8402a" stroke-width="3.6" stroke-dasharray="7 4.5" stroke-linecap="round"/>
        <path d="M14.4 51 L8.6 33" stroke="#5c6266" stroke-width="3" stroke-linecap="round"/>
        <path d="M14.4 51 L8.6 33" stroke="#e8edf0" stroke-width="1.3" stroke-linecap="round"/>
        <rect x="35" y="-1" width="14" height="7" rx="3" fill="#d9b04a" stroke="#6b4a0c"/>
      </svg>
      <div class="n"><b>14</b><small>sec</small></div>
    </div>
  </div>

  <button class="label cotton st st-blue slot-a picked" aria-pressed="true">
    <span class="slot felt-blue">A</span>
    <span class="pick-tag">
      <svg viewBox="0 0 46 22" aria-hidden="true"><path d="M6 11 H40" stroke="#9aa3a8" stroke-width="2.4" stroke-linecap="round"/><path d="M6 6 H34 a5 5 0 0 1 0 10" fill="none" stroke="#c4cbcf" stroke-width="2.4" stroke-linecap="round"/><circle cx="6" cy="11" r="5" fill="none" stroke="#9aa3a8" stroke-width="2.4"/><rect x="34" y="4" width="10" height="14" rx="3" fill="#c4cbcf" stroke="#6b7378"/></svg>
      <span class="felt-mustard">Your pick</span>
    </span>
    <p class="answer">i will reorganize your spice rack while you shower and call it love</p>
  </button>

  <button class="label cotton st st-blue slot-b">
    <span class="slot felt-blue">B</span>
    <p class="answer">overthinking a text for 40 minutes then just sending 'k' 💀</p>
  </button>

  <p class="helper">You can change your pick <b>until time runs out.</b></p>
</div>
  <div class="meadow" aria-hidden="true">
    <img src="art/pine-tall.png" alt="" style="left:-10px;width:86px">
    <img src="art/flower.png" alt="" style="left:76px;width:52px;bottom:-22px">
    <img src="art/wolf-patch.png" alt="" style="right:52px;width:84px;bottom:6px;transform:rotate(-10deg)">
    <img src="art/pine-small.png" alt="" style="right:20px;width:84px">
    <img src="art/mushroom.png" alt="" style="left:136px;width:46px;bottom:-16px">
  </div>
</div>

<svg class="patch-edge" viewBox="0 0 374 828" aria-hidden="true">
  <rect x="3" y="3" width="368" height="822" rx="24" fill="none" stroke="#d8402a" stroke-width="2.6"/>
  <rect x="7" y="7" width="360" height="814" rx="21" fill="none" stroke="#d8402a" stroke-width="9" stroke-dasharray="2.6 13"/>
</svg>
</body>
</html>
