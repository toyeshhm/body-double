<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Body Double · Your result (Heirloom Sampler)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .title1 { left: 26px; top: 102px; }
  .title2 { left: 26px; top: 134px; }

  .score { left: 24px; top: 172px; width: 336px; display: flex; align-items: center; justify-content: space-between; }
  .score .plus { animation: stitch-across .9s .3s steps(16) both; }
  .score .total { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .score .total span { font-size: 15px; font-weight: 700; color: var(--ink-soft); }

  .card { position: absolute; left: 30px; width: 330px; min-height: 160px; padding: 46px 18px 54px 72px; }
  .card .slot { left: 12px; top: -12px; filter: drop-shadow(0 2px 2px rgba(60, 40, 20, .25)); }
  .card .verdict { position: absolute; left: 70px; top: 16px; animation: stitch-across .9s steps(16) both; }
  .card .ans { font-size: 17px; line-height: 1.36; }
  .card .foot { height: 46px; }
  .card .sig { position: absolute; left: 16px; bottom: 9px; }
  .slot-a { top: 250px; transform: rotate(-.6deg); }
  .slot-b { top: 444px; transform: rotate(.6deg); }
  .slot-a .verdict { animation-delay: .9s; }
  .slot-b .verdict { animation-delay: 1.5s; }

  .seal { position: absolute; z-index: 3; }
  .wreath { right: 6px; bottom: -8px; width: 79px; height: 88px; animation: stitch-across .9s 1s steps(14) both; }
  .wreath .em { position: absolute; left: 0; right: 0; top: 25px; text-align: center; font-size: 28px; }
  .wolf { right: 2px; bottom: -18px; animation: stitch-in 1.1s 1.4s steps(18) both; }
  .sig.top { animation: unpick 1.1s .5s cubic-bezier(.6, 0, .4, 1) both; }
  .threads { position: absolute; left: 0; bottom: 0; width: 200px; height: 46px; overflow: visible; z-index: 2; }
  .threads path { fill: none; stroke-linecap: round; stroke-dasharray: 200; animation: draw .8s 1.3s ease-out both; }
  .ai { position: absolute; left: 126px; bottom: 12px; height: 24px; padding: 0 9px 0 22px; display: flex; align-items: center;
    font: 600 13px/1 var(--sans); color: var(--brown); background: #f7f1e3; box-shadow: 0 1px 2px rgba(60, 40, 20, .35);
    border-left: 3px solid var(--madder); }
  .ai::before { content: ""; position: absolute; left: 7px; top: 8px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink-soft); }

  .ask { left: 30px; top: 628px; font-size: 19px; color: var(--madder-ink); }
  .input { left: 30px; top: 656px; width: 330px; height: 54px; display: flex; align-items: center; padding: 0 20px; --run-inset: 5px; --run-w: 7px;
    font-size: 17px; color: #75644f; }
  .tell { top: 722px; }
</style>
</head>
<body class="phone">
<img class="frame" src="art/frame-phone.svg" alt="">

<header class="head">
  <img src="art/brand-phone.svg" alt="Body Double">
  <img src="art/code-hxqr-phone.svg" alt="Village HXQR">
</header>

<h1><img class="st title1" src="art/found-1.svg" alt="You found the real Maya."><img class="st title2" src="art/found-2.svg" alt=""></h1>

<div class="abs score">
  <img class="plus" src="art/plus100.svg" alt="+100">
  <div class="total"><span>Your score</span><img src="art/score-300-3.svg" alt="300"></div>
</div>

<div class="card patch slot-a">
  <img class="slot" src="art/slot-a-4.svg" alt="A">
  <img class="verdict" src="art/verdict-real-25.svg" alt="The real Maya">
  <p class="ans">i will reorganize your spice rack while you shower and call it love</p>
  <div class="foot"><img class="sig" src="art/sig-maya-3.svg" alt="Signed Maya"></div>
  <div class="seal wreath"><img src="art/wreath-3.svg" alt=""><span class="em">🦉</span></div>
</div>

<div class="card patch slot-b">
  <img class="slot" src="art/slot-b-4.svg" alt="B">
  <img class="verdict" src="art/verdict-wolf-25.svg" alt="It was the Wolf!">
  <p class="ans">overthinking a text for 40 minutes then just sending 'k' 💀</p>
  <div class="foot">
    <img class="sig" src="art/sig-maya-3-ripped.svg" alt="">
    <img class="sig top" src="art/sig-maya-3.svg" alt="The signature Maya, picked out">
    <svg class="threads" viewBox="0 0 200 46" aria-hidden="true">
      <path d="M104 20 C 112 8, 122 22, 116 30 S 120 42, 130 40" stroke="#2b3a67" stroke-width="2"/>
      <path d="M100 32 C 104 42, 112 40, 118 46" stroke="#2b3a67" stroke-width="1.8"/>
    </svg>
    <span class="ai">AI-written</span>
  </div>
  <img class="seal wolf" src="art/wolf-red-3.svg" alt="The Wolf, cross-stitched in red">
</div>

<p class="abs ask serif-i">What big eyes you have...</p>
<label class="abs input patch run-madder">What gave the Wolf away?</label>
<button class="btn tell"><span class="lbl">Tell the village</span></button>
</body>
</html>
