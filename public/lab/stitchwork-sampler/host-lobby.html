<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Body Double · Lobby (Heirloom Sampler)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .alphabet { left: 61px; top: 84px; }
  .brand { left: 1050px; top: 88px; }
  .title { left: 59px; top: 146px; }
  .code-cap { left: 66px; top: 222px; font-size: 30px; color: var(--ink-soft); }
  .code { left: 58px; top: 258px; }
  .url { left: 66px; top: 474px; font-size: 30px; font-weight: 600; letter-spacing: -.005em; }
  .url b { color: var(--madder-ink); font-weight: 700; }

  .qr { left: 752px; top: 146px; width: 316px; height: 350px; transform: rotate(-1.2deg); --run-inset: 10px; }
  .qr img { position: absolute; left: 38px; top: 34px; width: 240px; height: 240px; }
  .qr p { position: absolute; left: 0; right: 0; top: 290px; text-align: center; font-size: 24px; font-weight: 700; }
  .tack { position: absolute; width: 18px; height: 18px; }
  .tack::before, .tack::after { content: ""; position: absolute; left: 7px; top: -2px; width: 4px; height: 22px; border-radius: 2px; background: var(--madder); transform: rotate(45deg); box-shadow: 0 1px 1px rgba(40, 10, 5, .4); }
  .tack::after { transform: rotate(-45deg); background: #8c2820; }

  .settings { left: 1104px; top: 150px; width: 272px; }
  .settings h2 { font-size: 32px; color: var(--brown); margin: -4px 0 12px; }
  .settings dl { display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 3px; }
  .settings dt { font-size: 23px; font-weight: 500; color: var(--ink-soft); }
  .settings dd { height: 42px; display: flex; align-items: center; justify-content: flex-end; }
  .settings dd img { display: block; }
  .settings .rule { grid-column: 1 / -1; border-top: 2px dotted rgba(84, 67, 47, .35); }
  .begin { left: 1096px; top: 414px; width: 280px; height: 82px; font-size: 27px; }

  .arrived { left: 66px; top: 522px; font-size: 26px; font-weight: 700; }
  .arrived span { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--ink-soft); }
  .sq { top: 560px; width: 163px; height: 211px; }
  .sq > img { position: absolute; inset: 0; }
  .sq .em { position: absolute; left: 0; right: 0; top: 46px; text-align: center; font-size: 62px; line-height: 1; filter: drop-shadow(0 2px 1px rgba(60, 40, 20, .25)); }
  .sq .nm { position: absolute; left: 0; right: 0; top: 122px; text-align: center; font-size: 27px; font-weight: 700; line-height: 1; }
  .sq .rl { position: absolute; left: 0; right: 0; top: 156px; text-align: center; font-size: 22px; color: var(--ink-soft); line-height: 1; }
  .empty { top: 564px; width: 156px; height: 204px; border: 2px dashed rgba(43, 58, 103, .38); }
  .empty p { position: absolute; left: 12px; right: 12px; top: 118px; text-align: center; font-size: 22px; line-height: 1.1; color: var(--ink-soft); }
  .needle { position: absolute; left: 14px; top: 26px; width: 130px; height: 84px; overflow: visible; }

  .band { left: 48px; top: 794px; }
</style>
</head>
<body class="host">
<img class="frame" src="art/frame-host.svg" alt="">

<img class="st alphabet" src="art/alphabet.svg" alt="">
<img class="st brand" src="art/brand-host.svg" alt="Body Double">

<h1><img class="st title" src="art/title-village.svg" alt="The Village"></h1>
<p class="abs code-cap caption">Village code</p>
<img class="st code" src="art/code-hxqr.svg" alt="Village code HXQR">
<p class="abs url">bodydouble.tech/play/<b>HXQR</b></p>

<div class="abs qr patch run-madder">
  <span class="tack" style="left:8px;top:8px"></span><span class="tack" style="right:8px;top:8px"></span>
  <span class="tack" style="left:8px;bottom:8px"></span><span class="tack" style="right:8px;bottom:8px"></span>
  <img src="../_shared/qr.svg" alt="QR code to join the village">
  <p>Scan to enter</p>
</div>

<section class="abs settings">
  <h2 class="serif-i">Tale settings</h2>
  <dl>
    <dt>Chapters</dt><dd><img src="art/set-6.svg" alt="6"></dd>
    <span class="rule"></span>
    <dt>Answer time</dt><dd><img src="art/set-60.svg" alt="60s"></dd>
    <span class="rule"></span>
    <dt>Vote time</dt><dd><img src="art/set-20.svg" alt="20s"></dd>
    <span class="rule"></span>
    <dt>Demo mode</dt><dd><img src="art/set-off.svg" alt="off"></dd>
  </dl>
</section>
<button class="btn begin"><span class="lbl">Begin the tale</span></button>

<p class="abs arrived">Villagers who have arrived <span>(5)</span></p>
<div class="abs sq" style="left:64px"><img src="art/sq-1.svg" alt=""><span class="em">🦉</span><span class="nm">Maya</span><span class="rl caption">the bard</span></div>
<div class="abs sq" style="left:255px"><img src="art/sq-2.svg" alt=""><span class="em">🦊</span><span class="nm">Jordan</span><span class="rl caption">the woodcutter</span></div>
<div class="abs sq" style="left:446px"><img src="art/sq-3.svg" alt=""><span class="em">🍄</span><span class="nm">Priya</span><span class="rl caption">the witch</span></div>
<div class="abs sq" style="left:637px"><img src="art/sq-4.svg" alt=""><span class="em">🐻</span><span class="nm">Sam</span><span class="rl caption">the baker</span></div>
<div class="abs sq" style="left:828px"><img src="art/sq-5.svg" alt=""><span class="em">🐸</span><span class="nm">Theo</span><span class="rl caption">the knight</span></div>
<div class="abs empty" style="left:1023px">
  <svg class="needle" viewBox="0 0 130 84" aria-hidden="true">
    <defs><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f2ee"/><stop offset=".5" stop-color="#9a9894"/><stop offset="1" stop-color="#55524e"/></linearGradient></defs>
    <path d="M70 20 C 40 6, 14 30, 30 52 S 86 70, 104 50" fill="none" stroke="#a8322a" stroke-width="3" stroke-linecap="round"/>
    <path d="M70 20 C 40 6, 14 30, 30 52 S 86 70, 104 50" fill="none" stroke="#e2725f" stroke-width="1" stroke-dasharray="2 3" stroke-linecap="round" opacity=".8"/>
    <g transform="rotate(-28 70 30)">
      <path d="M22 30 L118 27.6 L118 32.4 Z" fill="url(#steel)" stroke="#5d5a55" stroke-width=".6"/>
      <rect x="104" y="28.6" width="10" height="2.8" rx="1.4" fill="#2d2a27"/>
    </g>
  </svg>
  <p class="caption">room for one more</p>
</div>
<div class="abs empty" style="left:1214px"><p class="caption" style="top:84px">and another</p></div>

<img class="st band" src="art/story-band.svg" alt="">
</body>
</html>
